<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HashGrid Bridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>HashGrid Bridge</h1>
      <span class="version" id="version">v1.0.5</span>
    </header>

    <section class="code-section">
      <label>Pairing Code</label>
      <div class="code-display">
        <span id="pairing-code">--------</span>
        <button id="copy-btn" class="icon-btn" title="Copy code">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 010 1.5h-1.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-1.5a.75.75 0 011.5 0v1.5A1.75 1.75 0 019.25 16h-7.5A1.75 1.75 0 010 14.25v-7.5z"/>
            <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0114.25 11h-7.5A1.75 1.75 0 015 9.25v-7.5zm1.75-.25a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25h-7.5z"/>
          </svg>
        </button>
      </div>
      <label class="fingerprint-label">Bridge Identity (verify in app)</label>
      <div class="fingerprint" id="fingerprint"></div>
      <div class="pairing-banner" id="pairing-banner" hidden></div>
      <div class="warning-banner" id="unknown-banner" hidden></div>
    </section>

    <section class="status-section">
      <div class="status-row">
        <span class="status-dot" id="relay-dot"></span>
        <span id="relay-status">Disconnected</span>
      </div>
      <div class="status-row">
        <span class="status-dot" id="peer-dot"></span>
        <span id="peer-status">No device connected</span>
      </div>
    </section>

    <section class="miners-section">
      <h2>Miners <span class="miner-count" id="miner-count">0</span></h2>
      <div id="miners-list" class="miners-list">
        <div class="empty-state">Scanning network...</div>
      </div>
    </section>

    <section class="settings-section">
      <h2>Settings</h2>
      <div class="setting-row">
        <label for="subnet-input">Custom Subnet</label>
        <div class="input-group">
          <input type="text" id="subnet-input" placeholder="e.g. 192.168.1">
          <button id="subnet-save" class="btn-small">Save</button>
        </div>
      </div>
      <p class="setting-hint">Enter your network's first 3 octets (e.g. 192.168.1) to scan for miners.</p>
    </section>

    <div class="actions">
      <button id="pair-btn" class="btn-secondary">Pair New Device</button>
      <button id="regenerate-btn" class="btn-secondary">Regenerate Code</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
