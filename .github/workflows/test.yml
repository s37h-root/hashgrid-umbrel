name: Test

# docker-publish.yml only runs on a v* tag, so these tests had never run in CI.
# That is how two stale parseBitAxeInfo assertions stayed red from 9028cb5 until
# a1760df. This suite is also the only executable spec of protocol/crypto
# behaviour shared with the macOS and Windows bridges — worth keeping green.
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel a run that a newer push to the same branch has superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A same-repo PR fires push AND pull_request for the same commit. The push
    # run already covers it, so skip the duplicate. Fork PRs produce no push
    # event here, so they still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Node 20 to match the node:20-alpine image this bridge actually ships in
      # (see Dockerfile), not whatever the dev machine happens to run.
      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
